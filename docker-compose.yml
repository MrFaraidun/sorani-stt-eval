version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sorani_stt_api
    ports:
      - "8000:8000"
    volumes:
      - ./models_cache:/app/models_cache
      - ./datasets:/app/datasets
      - ./results:/app/results
    environment:
      - STT_DEVICE=cuda
      - STT_LOG_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
